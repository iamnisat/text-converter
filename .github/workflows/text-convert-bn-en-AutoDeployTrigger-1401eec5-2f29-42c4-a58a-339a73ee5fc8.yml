name: Trigger auto deployment for text-convert-bn-en

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/text-convert-bn-en-AutoDeployTrigger-1401eec5-2f29-42c4-a58a-339a73ee5fc8.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TEXTCONVERTBNEN_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TEXTCONVERTBNEN_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TEXTCONVERTBNEN_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: aunkurprodacr.azurecr.io
          registryUsername: ${{ secrets.TEXTCONVERTBNEN_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.TEXTCONVERTBNEN_REGISTRY_PASSWORD }}
          containerAppName: text-convert-bn-en
          resourceGroup: aunkur-production-rg
          imageToBuild: aunkurprodacr.azurecr.io/text-convert-bn-en:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


